<div class="card bg-secondary border border-3 border-white h-100 shadow-sm">
  <div>
    <figure class="m-0">
      <img class="imgUser w-100" [src]="miUser()?.image" [alt]="miUser()?.first_name" />
    </figure>
    <div class="p-3 text-center">
      <p class="text-white fw-bold mb-0 text-truncate">
        {{ miUser()?.first_name }} {{ miUser()?.last_name }}
      </p>
    </div>
  </div>
  <!-- Iconos -->
  <div class="row w-100 border-top border-light pt-3 pb-3 g-0 mt-auto">
    <div class="col-4 text-center">
      <button class="btn btn-link text-decoration-none text-light p-0" [routerLink]="['/user', miUser()?._id]">
        <i class="bi bi-search d-block fs-4"></i>
        <small>Detalle</small>
      </button>
    </div>
    <div class="col-4 text-center border-start border-end border-light">
      <button class="btn btn-link text-decoration-none text-light p-0" [routerLink]="['/updateuser', miUser()?._id]">
        <i class="bi bi-arrow-repeat d-block fs-4"></i>
        <small>Actualizar</small>
      </button>
    </div>
    <div class="col-4 text-center">
      <button class="btn btn-link text-decoration-none text-light p-0" (click)="deleteUserById(miUser())">
        <i class="bi bi-trash d-block fs-4"></i>
        <small>Borrar</small>
      </button>
    </div>
  </div>
</div>
